<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모던 웹 계산기</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      padding: 20px;
    }

    .calculator-card {
      width: 100%;
      max-width: 360px;
      background: #181f2c;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 
                  0 0 0 1px rgba(255, 255, 255, 0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .display-container {
      padding: 32px 24px 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      min-height: 140px;
      word-break: break-all;
    }

    .previous-operand {
      color: #94a3b8;
      font-size: 1rem;
      min-height: 1.5rem;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .current-operand {
      color: #ffffff;
      font-size: 2.5rem;
      font-weight: 500;
      line-height: 1.2;
      transition: font-size 0.15s ease;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 20px;
      background: #131924;
      border-radius: 24px 24px 0 0;
    }

    button {
      height: 64px;
      border: none;
      outline: none;
      border-radius: 18px;
      font-size: 1.35rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.12s ease;
      color: #f1f5f9;
      background: #232d3f;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.2);
    }

    button:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.2);
    }

    /* 특수 기능 버튼 (AC, Backspace, %, ±) */
    .btn-function {
      background: #334155;
      color: #38bdf8;
    }
    .btn-function:hover {
      background: #475569;
    }

    /* 숫자 버튼 */
    .btn-number {
      background: #1e293b;
    }
    .btn-number:hover {
      background: #27354a;
    }

    /* 연산자 버튼 */
    .btn-operator {
      background: #f59e0b;
      color: #ffffff;
    }
    .btn-operator:hover {
      background: #d97706;
    }

    /* 등호 버튼 */
    .btn-equals {
      background: #10b981;
      color: #ffffff;
    }
    .btn-equals:hover {
      background: #059669;
    }

    .shortcut-guide {
      text-align: center;
      padding: 12px 10px;
      color: #64748b;
      font-size: 0.75rem;
      background: #131924;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    @media (max-width: 400px) {
      .calculator-card {
        max-width: 100%;
        border-radius: 20px;
      }
      button {
        height: 56px;
        font-size: 1.2rem;
        border-radius: 14px;
      }
      .current-operand {
        font-size: 2.1rem;
      }
    }
  </style>
</head>
<body>

  <div class="calculator-card">
    <div class="display-container">
      <div class="previous-operand" id="previous-operand"></div>
      <div class="current-operand" id="current-operand">0</div>
    </div>

    <div class="keypad">
      <!-- 1번째 행 -->
      <button class="btn-function" data-action="all-clear">AC</button>
      <button class="btn-function" data-action="delete">⌫</button>
      <button class="btn-function" data-action="percent">%</button>
      <button class="btn-operator" data-operator="÷">÷</button>

      <!-- 2번째 행 -->
      <button class="btn-number" data-number="7">7</button>
      <button class="btn-number" data-number="8">8</button>
      <button class="btn-number" data-number="9">9</button>
      <button class="btn-operator" data-operator="×">×</button>

      <!-- 3번째 행 -->
      <button class="btn-number" data-number="4">4</button>
      <button class="btn-number" data-number="5">5</button>
      <button class="btn-number" data-number="6">6</button>
      <button class="btn-operator" data-operator="-">-</button>

      <!-- 4번째 행 -->
      <button class="btn-number" data-number="1">1</button>
      <button class="btn-number" data-number="2">2</button>
      <button class="btn-number" data-number="3">3</button>
      <button class="btn-operator" data-operator="+">+</button>

      <!-- 5번째 행 -->
      <button class="btn-number" data-action="toggle-sign">±</button>
      <button class="btn-number" data-number="0">0</button>
      <button class="btn-number" data-number=".">.</button>
      <button class="btn-equals" data-action="calculate">=</button>
    </div>

    <div class="shortcut-guide">
      키보드 지원: 숫자 0~9, +, -, *, /, Enter(=), Backspace, Esc(AC)
    </div>
  </div>

  <script>
    class Calculator {
      constructor(previousOperandElem, currentOperandElem) {
        this.previousOperandElem = previousOperandElem;
        this.currentOperandElem = currentOperandElem;
        this.clear();
      }

      clear() {
        this.currentOperand = '0';
        this.previousOperand = '';
        this.operation = undefined;
        this.shouldResetScreen = false;
        this.isError = false;
      }

      delete() {
        if (this.isError) {
          this.clear();
          return;
        }
        if (this.shouldResetScreen) {
          return;
        }
        if (this.currentOperand.length === 1 || (this.currentOperand.length === 2 && this.currentOperand.startsWith('-'))) {
          this.currentOperand = '0';
        } else {
          this.currentOperand = this.currentOperand.slice(0, -1);
        }
      }

      appendNumber(number) {
        if (this.isError) {
          this.clear();
        }

        if (this.shouldResetScreen) {
          this.currentOperand = '';
          this.shouldResetScreen = false;
        }

        if (number === '.' && this.currentOperand.includes('.')) return;
        if (number === '.' && (this.currentOperand === '' || this.currentOperand === '0')) {
          this.currentOperand = '0.';
          return;
        }
        if (this.currentOperand === '0' && number !== '.') {
          this.currentOperand = number.toString();
        } else {
          this.currentOperand = this.currentOperand.toString() + number.toString();
        }
      }

      toggleSign() {
        if (this.isError || this.currentOperand === '0' || this.currentOperand === '') return;
        if (this.currentOperand.startsWith('-')) {
          this.currentOperand = this.currentOperand.substring(1);
        } else {
          this.currentOperand = '-' + this.currentOperand;
        }
      }

      applyPercent() {
        if (this.isError || this.currentOperand === '' || this.currentOperand === '0') return;
        const current = parseFloat(this.currentOperand);
        if (isNaN(current)) return;
        const result = current / 100;
        this.currentOperand = this.formatNumber(result);
      }

      chooseOperation(operation) {
        if (this.isError) this.clear();

        if (this.currentOperand === '') {
          if (this.previousOperand !== '') {
            this.operation = operation;
          }
          return;
        }

        if (this.previousOperand !== '') {
          this.compute();
        }

        if (this.isError) return;

        this.operation = operation;
        this.previousOperand = this.currentOperand;
        this.shouldResetScreen = true;
      }

      compute() {
        let computation;
        const prev = parseFloat(this.previousOperand);
        const current = parseFloat(this.currentOperand);

        if (isNaN(prev) || isNaN(current)) return;

        switch (this.operation) {
          case '+':
            computation = prev + current;
            break;
          case '-':
            computation = prev - current;
            break;
          case '×':
          case '*':
            computation = prev * current;
            break;
          case '÷':
          case '/':
            if (current === 0) {
              this.currentOperand = '0으로 나눌 수 없음';
              this.previousOperand = '';
              this.operation = undefined;
              this.isError = true;
              return;
            }
            computation = prev / current;
            break;
          default:
            return;
        }

        // 부동소수점 오차 완화 (최대 12자리 반올림)
        computation = Math.round((computation + Number.EPSILON) * 1e12) / 1e12;

        this.currentOperand = this.formatNumber(computation);
        this.operation = undefined;
        this.previousOperand = '';
        this.shouldResetScreen = true;
      }

      formatNumber(number) {
        if (typeof number === 'string') {
          if (isNaN(Number(number))) return number;
          number = Number(number);
        }
        return number.toLocaleString('ko-KR', { maximumFractionDigits: 10 });
      }

      updateDisplay() {
        if (this.isError) {
          this.currentOperandElem.innerText = this.currentOperand;
          this.previousOperandElem.innerText = '';
          this.adjustFontSize();
          return;
        }

        if (this.currentOperand.includes('.')) {
          const parts = this.currentOperand.split('.');
          const integerPart = parseFloat(parts[0]);
          const formattedInt = isNaN(integerPart) ? '0' : integerPart.toLocaleString('ko-KR');
          this.currentOperandElem.innerText = `${parts[0].startsWith('-') && integerPart === 0 ? '-' : ''}${formattedInt}.${parts[1]}`;
        } else {
          const parsed = parseFloat(this.currentOperand);
          this.currentOperandElem.innerText = isNaN(parsed) ? this.currentOperand : parsed.toLocaleString('ko-KR');
        }

        if (this.operation != null) {
          const prevParsed = parseFloat(this.previousOperand);
          const formattedPrev = isNaN(prevParsed) ? this.previousOperand : prevParsed.toLocaleString('ko-KR');
          this.previousOperandElem.innerText = `${formattedPrev} ${this.operation}`;
        } else {
          this.previousOperandElem.innerText = '';
        }

        this.adjustFontSize();
      }

      adjustFontSize() {
        const len = this.currentOperandElem.innerText.length;
        if (len > 12) {
          this.currentOperandElem.style.fontSize = '1.5rem';
        } else if (len > 8) {
          this.currentOperandElem.style.fontSize = '2rem';
        } else {
          this.currentOperandElem.style.fontSize = '2.5rem';
        }
      }
    }

    const previousOperandElem = document.getElementById('previous-operand');
    const currentOperandElem = document.getElementById('current-operand');
    const calculator = new Calculator(previousOperandElem, currentOperandElem);

    // 마우스 클릭 이벤트 위임
    document.querySelector('.keypad').addEventListener('click', (e) => {
      const target = e.target.closest('button');
      if (!target) return;

      if (target.dataset.number) {
        calculator.appendNumber(target.dataset.number);
      } else if (target.dataset.operator) {
        calculator.chooseOperation(target.dataset.operator);
      } else if (target.dataset.action === 'all-clear') {
        calculator.clear();
      } else if (target.dataset.action === 'delete') {
        calculator.delete();
      } else if (target.dataset.action === 'calculate') {
        calculator.compute();
      } else if (target.dataset.action === 'toggle-sign') {
        calculator.toggleSign();
      } else if (target.dataset.action === 'percent') {
        calculator.applyPercent();
      }

      calculator.updateDisplay();
    });

    // 키보드 지원
    window.addEventListener('keydown', (e) => {
      let handled = true;

      if ((e.key >= '0' && e.key <= '9') || e.key === '.') {
        calculator.appendNumber(e.key);
      } else if (e.key === '+') {
        calculator.chooseOperation('+');
      } else if (e.key === '-') {
        calculator.chooseOperation('-');
      } else if (e.key === '*') {
        calculator.chooseOperation('×');
      } else if (e.key === '/') {
        e.preventDefault();
        calculator.chooseOperation('÷');
      } else if (e.key === 'Enter' || e.key === '=') {
        e.preventDefault();
        calculator.compute();
      } else if (e.key === 'Backspace') {
        calculator.delete();
      } else if (e.key === 'Escape') {
        calculator.clear();
      } else if (e.key === '%') {
        calculator.applyPercent();
      } else {
        handled = false;
      }

      if (handled) {
        calculator.updateDisplay();
      }
    });
  </script>
</body>
</html>
